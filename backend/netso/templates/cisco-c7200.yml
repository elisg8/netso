name: cisco-c7200
title: Cisco IOS C7200 (Dynamips)
kind: dynamips
description: Classic Cisco 7200 (Dynamips) with your c7200-*.image IOS image. Set idle-pc to avoid burning CPU.
icon: router
vendor: Cisco
image: c7200
machine: c7200
ram: 512
slots: [C7200-IO-FE, PA-2FE-TX, PA-2FE-TX, PA-4E]
console: telnet
config_method: nvram
config_file: startup-config.cfg
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
