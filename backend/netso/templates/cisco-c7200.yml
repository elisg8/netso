name: cisco-c7200
title: Cisco IOS C7200 (Dynamips)
kind: dynamips
description: Cisco 7200 classico (Dynamips) con la tua immagine IOS c7200-*.image. Imposta idle-pc per non consumare CPU.
icon: router
vendor: Cisco
image: c7200
machine: c7200
ram: 512
slots: [C7200-IO-FE, PA-2FE-TX, PA-2FE-TX, PA-4E]
console: telnet
config_method: nvram
config_file: startup-config.cfg
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
