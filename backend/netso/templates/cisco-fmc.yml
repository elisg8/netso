name: cisco-fmc
title: Cisco Secure Firewall Management Center (FMCv)
kind: qemu
description: Cisco Firepower / Secure Firewall Management Center Virtual (FMCv), the manager for FTDs. Cisco image for KVM (.qcow2), NOT the Azure/AWS cloud variant (that one hangs at firstboot on waagent). Image not included.
icon: server
image: cisco-fmc
cpus: 4
ram: 8192
nics: 1
nic_model: e1000
disk_bus: virtio
console: vnc
iface_prefix: eth
iface_start: 0
# Values like the EVE-NG/PNETLab firepower6-FMC template: 4 vCPU, 8 GB, VNC console, e1000 NIC,
# -cpu host. FMCv runs on Linux: no async-PF workaround (that is needed by FTDv, which is FreeBSD-based).
# Very long first boot (30-60 min: it builds the database); visible on the VNC console,
# login admin/Admin123, then management from the web UI on the management interface (eth0).
# A single mgmt NIC (EVE gives 5 because it is a generic template, but the FMC uses only eth0).
cpu_model: host
config_method: none
console_user: admin
