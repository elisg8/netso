name: cisco-iosv
title: Cisco vIOS Router
kind: qemu
description: Cisco IOSv (L3 router). Image from Cisco/CML, not included.
icon: router
image: cisco-iosv
cpus: 1
ram: 768
nics: 4
nic_model: e1000
disk_bus: virtio
console: telnet
iface_prefix: Gi0/
iface_start: 0
config_method: disk
config_file: ios_config.txt
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
