name: vpc
title: Virtual PC (VPCS)
kind: docker
description: Ultra-lightweight virtual PC, VPCS-style (ip, ping, trace, dhcp). Alpine container.
icon: host
image: alpine:latest
cpus: 1
ram: 32
nics: 1
console: exec
shell: [sh, /usr/local/bin/vpc]
assets:
  /usr/local/bin/vpc: vpc.sh
cmd: [sh, /usr/local/bin/vpc, --boot]
config_method: copy
config_file: /etc/vpc.conf
privileged: true
save_cmd: [cat, /run/vpc.state]
