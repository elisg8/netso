name: cisco-ftd
title: Cisco Secure Firewall (FTDv)
kind: qemu
description: Cisco Firepower Threat Defense Virtual (FTDv). Cisco image, not included.
icon: firewall
image: cisco-ftd
cpus: 4
ram: 8192
nics: 8
nic_model: virtio-net-pci
disk_bus: virtio
console: telnet
iface_prefix: Gi
iface_start: 0
# FTDv is FreeBSD-based: under KVM it kernel-panics ("Host injected async #PF
# in kernel mode") because the guest does not handle paravirtual async page-faults.
# Disabling them in the QEMU CPU lets the VM boot. Also applies to pfSense/OPNsense.
cpu_model: host,-kvm-asyncpf,-kvm-asyncpf-int
config_method: none
ansible_os: cisco.ftd.ftd
