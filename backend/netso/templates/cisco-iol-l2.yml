name: cisco-iol-l2
title: Cisco IOL Switch L2
kind: iol
description: Cisco IOL L2 (switch with VLAN, STP, trunk), run directly like in EVE-NG/GNS3 with your .bin file and your iourc license.
icon: switch
vendor: Cisco
image: iol-l2
ram: 1024
nics: 16
console: telnet
config_method: nvram
config_file: startup-config.cfg
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
