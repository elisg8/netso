name: cisco-iol
title: Cisco IOL Router
kind: iol
description: Cisco IOL (IOS on Linux) L3, run directly like in EVE-NG/GNS3 with your .bin file and your iourc license. Lightweight, boots in a few seconds.
icon: router
vendor: Cisco
image: iol-l3
ram: 1024
nics: 8
console: telnet
config_method: nvram
config_file: startup-config.cfg
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
