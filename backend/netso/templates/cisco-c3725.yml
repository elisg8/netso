name: cisco-c3725
title: Cisco IOS C3725 (Dynamips)
kind: dynamips
description: Classic Cisco 3725 (Dynamips) with your c3725-*.bin IOS image; NM-16ESW = 16-port switch.
icon: router
vendor: Cisco
image: c3725
machine: c3725
ram: 256
slots: [GT96100-FE, NM-1FE-TX, NM-16ESW]
console: telnet
config_method: nvram
config_file: startup-config.cfg
save_cli: [terminal length 0, show running-config]
save_enable: true
ansible_os: cisco.ios.ios
